<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOKVA — Connexion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #312E81 0%, #6366F1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            color: #312E81;
            margin-bottom: 0.25rem;
            font-size: 1.75rem;
        }
        .subtitle { color: #6b7280; margin-bottom: 1.75rem; font-size: 0.9rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; }
        input {
            width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 1rem; margin-bottom: 1rem;
        }
        input:focus { outline: 2px solid #6366F1; outline-offset: -1px; border-color: transparent; }
        button {
            width: 100%; padding: 0.85rem; background: #312E81; color: white; border: none;
            border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: background .2s;
        }
        button:hover { background: #4338CA; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message {
            color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem;
            min-height: 1.25rem;
        }
        .footer {
            text-align: center; margin-top: 2rem; color: #9ca3af; font-size: 0.75rem;
        }
        .footer strong { color: #06B6D4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>STOKVA</h1>
        <p class="subtitle">Gestion des Dépôts de Stockage</p>

        <form id="login-form">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" name="username" id="username" autocomplete="username" required autofocus>

            <label for="password">Mot de passe</label>
            <input type="password" name="password" id="password" autocomplete="current-password" required>

            <div class="error-message"></div>

            <button type="submit">Se connecter</button>
        </form>

        <div class="footer">
            powered by <strong>NETPROCESS</strong>
        </div>
    </div>

    <script>
        // Si le backend est sur un autre host, modifier ici :
        // window.STOKVA_API_BASE = 'http://192.168.1.10:3000';
    </script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (STOKVA.isAuthenticated()) {
            window.location.href = 'index.html';
        }
        Auth.bindLoginForm('#login-form', 'index.html');
    </script>
</body>
</html>
